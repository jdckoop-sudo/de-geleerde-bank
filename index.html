<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>CVHJ Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090A; --bg-alt:#0E0F11; --surface:#151619; --surface-2:#1C1E22;
    --line: rgba(255,255,255,0.08); --text:#F2F1ED; --text-dim:#8B9099;
    --accent:#F2B807; --accent-dim:#7A6420;
    --c-gold:#F2B807; --c-teal:#2FBF8F; --c-plum:#B07AE0; --c-rose:#E85A4F; --c-blue:#4FA0E0;
    --gk:#4F8FB8; --def:#2F9E7E; --mid:#F2B807; --fwd:#E1553A; --danger:#D3564C;
    --type-friendly:#7A8B94; --type-ere:#F2B807; --type-euro:#9B7BC4; --type-int:#4F8FB8; --type-beker:#C97B3D;
    --radius:14px;
  }
  body.light{
    --bg:#EEF3EE; --bg-alt:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F6F2;
    --line: rgba(11,46,31,0.12); --text:#122A1D; --text-dim:#4B6156;
    --accent:#B8860B; --accent-dim:#D9C27E;
    --gk:#3573A0; --def:#1F7A5F; --mid:#B8860B; --fwd:#C43F26; --danger:#C1443C;
  }
  body.theme-egirl{
    --bg:#FCE9F7; --bg-alt:#FFFFFF; --surface:#FFFFFF; --surface-2:#FFF3FB;
    --line: rgba(180,40,140,0.15); --text:#5A2A5E; --text-dim:#A159AC;
    --accent:#FF3EA5; --accent-dim:#FFB3E6;
    --gk:#7FD6FF; --def:#3ECF8F; --mid:#C98CFF; --fwd:#FF6FB5; --danger:#E0457A;
  }
  body.theme-cvhj{
    --bg:#F4F5F7; --bg-alt:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F2F4;
    --line: rgba(20,20,20,0.10); --text:#151515; --text-dim:#6B6F76;
    --accent:#1F9D55; --accent-dim:#BFE8CF;
    --gk:#3573A0; --def:#1F9D55; --mid:#C9A227; --fwd:#C43F26; --danger:#C1443C;
  }
  body.theme-darren{
    --bg:#160406; --bg-alt:#210608; --surface:#2A090C; --surface-2:#380D10;
    --line: rgba(255,138,128,0.18); --text:#FFEDEB; --text-dim:#E0A8A2;
    --accent:#FFD24C; --accent-dim:#8A5A10;
    --gk:#4F8FB8; --def:#E0A8A2; --mid:#FFD24C; --fwd:#FF503C; --danger:#FF503C;
    background:
      url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22360%22%20height%3D%22180%22%20viewBox%3D%220%200%20360%20180%22%3E%0A%3Ctext%20x%3D%22-20%22%20y%3D%2240%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-size%3D%2217%22%20font-weight%3D%22800%22%20fill%3D%22rgba%28255%2C90%2C70%2C0.07%29%22%20transform%3D%22rotate%28-18%20180%2090%29%22%3EDARREN%20WERD%2017E%20OP%20HET%20WK%3C/text%3E%0A%3Ctext%20x%3D%22-40%22%20y%3D%22120%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-size%3D%2217%22%20font-weight%3D%22800%22%20fill%3D%22rgba%28255%2C210%2C76%2C0.05%29%22%20transform%3D%22rotate%28-18%20180%2090%29%22%3EDE%20WK-COACH%3C/text%3E%0A%3C/svg%3E") repeat,
      radial-gradient(1100px 500px at 15% -10%, rgba(255,80,60,0.10), transparent 60%),
      #160406;
  }
  body.theme-pokemon{
    --bg:#14151F; --bg-alt:#1B1D2B; --surface:#232538; --surface-2:#2C2F45;
    --line: rgba(255,210,76,0.15); --text:#FFF8E0; --text-dim:#B8B4D0;
    --accent:#FFD24C; --accent-dim:#8A6E1A;
    --gk:#5CA9FF; --def:#4CD97A; --mid:#FFD24C; --fwd:#FF7A5C; --danger:#FF5C5C;
  }
  body.theme-gamer{
    --bg:#0A0A0A; --bg-alt:#0F0F0F; --surface:#141414; --surface-2:#1A1A1A;
    --line: rgba(57,255,20,0.18); --text:#EFFFEF; --text-dim:#8FAF8F;
    --accent:#39FF14; --accent-dim:#1F7A0E;
    --gk:#4FA0E0; --def:#39FF14; --mid:#FF7A00; --fwd:#FF7A00; --danger:#FF3B3B;
  }
  body.theme-ios{
    --bg:#F2F2F7; --bg-alt:#FFFFFF; --surface:#FFFFFF; --surface-2:#F9F9FB;
    --line: rgba(60,60,67,0.15); --text:#000000; --text-dim:#8E8E93;
    --accent:#007AFF; --accent-dim:#B7D9FF;
    --gk:#5AC8FA; --def:#34C759; --mid:#FF9500; --fwd:#FF3B30; --danger:#FF3B30;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(242,184,7,0.08), transparent 60%),
      repeating-linear-gradient(90deg, rgba(245,243,237,0.025) 0 2px, transparent 2px 140px),
      var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;
    transition:background .4s ease;
  }
  body.sandbox-theme{
    background:
      radial-gradient(120px 120px at 88% 6%, #FFE07A, #FFE07A 40%, transparent 42%),
      linear-gradient(180deg, #FFDE9E 0%, #FFDE9E 22%, #F5C878 23%, #EAB65C 55%, #DDA24A 100%);
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36"><g transform="rotate(-40 18 18)"><rect x="15" y="4" width="6" height="16" rx="1" fill="%236B4A2E"/><path d="M10 18 L26 18 L23 30 Q18 34 13 30 Z" fill="%23B0B8BF" stroke="%23444" stroke-width="1"/></g></svg>') 4 4, auto;
  }
  body.sandbox-theme .wrap::before{
    content:'SANDBOX-MODUS — vrij experimenteren, los van je echte team';
    display:block; text-align:center; font-family:'JetBrains Mono'; font-size:12px; letter-spacing:0.5px;
    background:rgba(0,0,0,0.15); color:#4A3419; padding:6px; border-radius:8px; margin-bottom:14px;
  }
  body.theme-darren .wrap::before{
    content:'🏆 HERINNERING: DARREN WERD 17E MET DE WK-COACH 🏆';
    display:block; text-align:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.5px;
    background:linear-gradient(90deg,#FF503C,#8A0E0E,#FF503C); color:#fff; padding:9px; border-radius:10px; margin-bottom:16px;
    box-shadow:0 2px 12px rgba(255,80,60,0.4);
  }
  body.theme-darren .glb-sub{color:#FF503C !important;}
  body.theme-darren .glb-badge::after{content:'🤡'; position:absolute; font-size:14px; top:-8px; right:-8px;}
  @media (max-width:760px){
    body.theme-darren .wrap::before{font-size:11px; padding:8px 6px;}
    body.theme-darren{
      background-size: 220px 110px, auto, auto;
    }
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px;padding-left:calc(20px + 76px);}
  .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:76px; background:var(--bg-alt); border-right:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; padding:18px 0; gap:6px; z-index:70; overflow-y:auto;
  }
  .sidebar-logo{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--accent);margin-bottom:14px;}
  body.theme-cvhj .sidebar{background:#0B0B0C; border-right:1px solid rgba(255,255,255,0.08);}
  body.theme-cvhj .sidebar-btn{color:rgba(255,255,255,0.55);}
  body.theme-cvhj .sidebar-btn:hover{background:rgba(255,255,255,0.06); color:#fff;}
  body.theme-cvhj header.top{background:#0B0B0C; margin:-28px -20px 22px; padding:18px 20px; border-radius:0 0 16px 16px;}
  body.theme-cvhj header.top h1, body.theme-cvhj header.top .season, body.theme-cvhj header.top .back-btn{color:#fff;}
  body.theme-cvhj header.top .back-btn{background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.2);}
  body.theme-cvhj .mode-toggle{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);}
  body.theme-cvhj .mode-toggle button{color:rgba(255,255,255,0.6);}
  body.theme-cvhj .mode-toggle button.active{background:var(--accent); color:#fff;}
  @media (max-width:760px){ body.theme-cvhj header.top{margin:-16px -14px 18px;} }
  .sidebar-btn{
    width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    background:none; border:none; color:var(--text-dim); cursor:pointer; flex-direction:column; gap:2px; position:relative;
  }
  .sidebar-btn span.sb-label{font-size:8px; font-family:'JetBrains Mono'; text-transform:uppercase; letter-spacing:0.3px;}
  .sidebar-btn:hover{background:var(--surface); color:var(--text);}
  .sidebar-btn.active{background:rgba(242,184,7,0.12); color:var(--accent);}
  .sidebar-btn.active::before{content:'';position:absolute;left:-9px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:0 3px 3px 0;}
  .sidebar-spacer{flex:1;}
  @media (max-width: 760px){
    .wrap{padding-left:20px; padding-bottom:150px;}
    .sidebar{
      left:0; right:0; top:auto; bottom:0; width:100%; height:auto; flex-direction:row; flex-wrap:wrap;
      justify-content:center; align-items:center; border-right:none; border-top:1px solid var(--line); padding:6px 4px 8px; gap:0;
    }
    .sidebar-logo{display:none;}
    .sidebar-btn{width:20%; flex:0 0 20%; height:56px; border-radius:12px;}
    .sidebar-spacer{display:none; width:0; flex-basis:0;}
  }

  /* ---- Bredere mobiele verbeteringen: leesbaarder, grotere aanraakdoelen, minder gepropt ---- */
  @media (max-width: 760px){
    body{font-size:15px;}
    .wrap{padding-left:14px; padding-right:14px; padding-top:16px;}
    h1{font-size:20px;}
    .season{font-size:11px;}

    header.top{gap:10px;margin-bottom:16px;}
    .brand{gap:8px;}
    .budget-pill{font-size:11px;padding:8px 10px;}

    .btn, .theme-toggle, select, input[type="text"], input[type="number"]{
      min-height:42px; font-size:14px !important;
    }
    .btn{padding:11px 16px;}

    .toolbar{display:flex; flex-direction:column; align-items:stretch; gap:8px;}
    .toolbar select, .toolbar input, .toolbar > *{width:100%;}
    .toolbar .view-toggle{display:flex;}
    .view-toggle button{flex:1;}

    .primary-tabs, nav.tabs{overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap;}
    .sub-tabs{overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap; white-space:nowrap;}
    .sub-tabs button{flex-shrink:0; font-size:13px;}

    .summary-cards{grid-template-columns:1fr 1fr; gap:10px;}
    .summary-card{padding:14px;}
    .summary-card .value{font-size:22px !important;}
    .summary-card .label{font-size:10px;}

    .grid{grid-template-columns:1fr 1fr !important; gap:10px;}
    .tile{padding:12px;}

    .box{width:96vw !important; max-width:96vw !important; margin:0 auto; max-height:88vh;}
    .overlay{padding:3vh 8px;}
    .head h4{font-size:15px;}

    .stat-table{font-size:12px;}
    .stat-table th, .stat-table td{padding:8px 6px !important; white-space:nowrap;}

    .formation-row{overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap;}
    .formation-row button{flex-shrink:0;}

    .pitch{max-width:100%;}
    .pitch-chip-name{font-size:11px;}
    .pitch-chip-price, .pitch-chip-opp{font-size:9px;}

    .slot-name{font-size:14px;}
    .slot-sub, .slot-opp{font-size:11px;}

    .h2h-row{flex-direction:column; align-items:stretch; gap:8px; text-align:center;}
    .h2h-mid{padding:4px 0;}
    .h2h-side.right{text-align:center;}
    .h2h-side.right .h2h-club{justify-content:center;}

    .picker-item{flex-wrap:wrap;}
    .news-note{font-size:13px;}

    .bankie-panel, .calc-panel{width:92vw !important; right:4vw !important;}
    .bankie-launcher{top:74px; bottom:auto; right:12px; width:46px; height:46px; font-size:20px;}
    .calc-launcher{top:128px; bottom:auto; right:12px; width:42px; height:42px;}
    .quick-actions-stack{top:180px; bottom:auto; right:12px; flex-direction:row; gap:8px;}
    .quick-action-btn{width:38px; height:38px;}
    .quick-actions-toggle{top:74px; bottom:auto; right:66px; width:28px; height:28px;}
    .float-drag-handle{top:126px; bottom:auto; right:64px; width:40px; height:40px; border-radius:50%; border:1px solid var(--line) !important;}
  }
  header.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .glb-badge{position:relative;width:38px;height:38px;border-radius:11px;background:#0B0B0C;color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
  .glb-wordmark{display:flex;flex-direction:column;line-height:1;}
  .glb-main{font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.5px;color:var(--text);}
  .glb-sub{font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;letter-spacing:1px;color:var(--accent); text-transform:uppercase; margin-top:1px;}
  .back-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .back-btn:hover{border-color:var(--accent-dim);}
  .back-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .cal-club-filter-wrap{position:relative;}
  .cal-club-menu{position:absolute;top:100%;left:0;margin-top:6px;background:var(--bg-alt);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:40;min-width:220px;max-height:280px;overflow-y:auto;padding:8px;}
  .cal-club-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;font-size:12px;cursor:pointer;}
  .cal-club-item:hover{background:var(--surface);}
  .cal-club-clear{width:100%;text-align:left;background:none;border:none;color:var(--accent);font-size:11px;padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--line);margin-bottom:4px;}
  .h2h-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
  .h2h-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;}
  .h2h-row:hover{border-color:var(--accent-dim);}
  .h2h-side{flex:1;min-width:0;}
  .h2h-side.right{text-align:right;}
  .h2h-club{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;}
  .h2h-side.right .h2h-club{justify-content:flex-end;}
  .h2h-players{font-size:11px;color:var(--text-dim);margin-top:3px;}
  .h2h-players.none{color:var(--danger);}
  .h2h-mid{flex-shrink:0;text-align:center;font-family:'JetBrains Mono';padding:0 10px;}
  .h2h-date{font-size:11px;color:var(--text);}
  .h2h-time{font-size:10px;color:var(--text-dim);}
  .couch-logo{font-size:34px;line-height:1;}
  .brand h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.5px;margin:0;text-transform:uppercase;}
  .brand .season{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:0.3px;}
  .budget-pill{font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:999px;display:flex;gap:10px;align-items:center;}
  .budget-pill b{color:var(--accent);}
  .budget-pill.over{border-color:var(--danger);}
  .budget-pill.over b{color:var(--danger);}
  .theme-toggle{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .theme-toggle:hover{border-color:var(--accent-dim);}
  .mode-toggle-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .mode-toggle{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;}
  .mode-toggle button{background:none;border:none;color:var(--text-dim);font-family:'Oswald';font-size:12px;text-transform:uppercase;letter-spacing:0.4px;padding:7px 16px;border-radius:999px;cursor:pointer;}
  .mode-toggle button.active{background:var(--accent);color:#0B0B0C;}

  nav.tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  nav.tabs button{
    font-family:'Oswald',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:0.5px;
    background:none;border:none;color:var(--text-dim);padding:12px 4px;margin-right:22px;cursor:pointer;
    border-bottom:3px solid transparent;transition:color .15s, border-color .15s;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{color:var(--accent);border-color:var(--accent);}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .toolbar input[type=text]{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'Inter';font-size:14px;}
  .toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-family:'Inter';font-size:14px;}
  .toolbar input::placeholder{color:var(--text-dim);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(230px,1fr));gap:14px;}
  .tile{background:linear-gradient(160deg, var(--surface-2), var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px;position:relative;overflow:hidden;cursor:pointer;transition:transform .12s, border-color .12s;}
  .tile:hover{transform:translateY(-2px);border-color:var(--accent-dim);}
  .tile .stripe{position:absolute;left:0;top:0;bottom:0;width:5px;}
  .tile .top-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .tile .pos-badge{font-family:'JetBrains Mono';font-size:10px;text-transform:uppercase;letter-spacing:0.5px;padding:3px 7px;border-radius:6px;color:#0B2E1F;font-weight:600;}
  .tile h3{font-family:'Oswald';font-size:17px;margin:0 0 2px;font-weight:600;line-height:1.2;}
  .tile .club{font-size:12px;color:var(--text-dim);margin-bottom:10px;}
  .tile .stats-row{display:flex;justify-content:space-between;align-items:center;}
  .tile .price{font-family:'JetBrains Mono';font-size:14px;color:var(--text);}
  .gauge{position:relative;width:46px;height:46px;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono';font-size:11px;font-weight:600;}
  .tile .mini-stats{display:flex;gap:10px;margin-top:10px;font-family:'JetBrains Mono';font-size:11px;color:var(--text-dim);flex-wrap:wrap;}
  .tile .mini-stats span b{color:var(--text);}
  .new-badge{font-family:'JetBrains Mono';font-size:10px;color:var(--accent);margin-top:8px;letter-spacing:0.5px;}

  .section-title{font-family:'Oswald';text-transform:uppercase;letter-spacing:0.8px;font-size:13px;color:var(--text-dim);margin:26px 0 10px;display:flex;align-items:center;gap:10px;}
  .section-title .line{flex:1;height:1px;background:var(--line);}

  .formation-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .formation-row button{font-family:'JetBrains Mono';font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--text-dim);padding:8px 14px;border-radius:8px;cursor:pointer;}
  .formation-row button.active{border-color:var(--accent);color:var(--accent);background:rgba(242,184,7,0.08);}
  .formation-row button:disabled{opacity:0.35;cursor:not-allowed;}
  .swap-failure-banner{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .swap-failure-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(211,86,76,0.12);border:1px solid var(--danger);border-radius:10px;padding:10px 14px;font-size:13px;}
  .swap-failure-item button{background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer;}

  .slot-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(210px,1fr));gap:12px;}
  .slot{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px;min-height:78px;display:flex;flex-direction:column;justify-content:center;position:relative;cursor:pointer;}
  .slot.filled{border-style:solid;border-color:var(--line);}
  .slot .slot-label{font-family:'JetBrains Mono';font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
  .slot .slot-name{font-family:'Oswald';font-size:15px;font-weight:600;}
  .slot .slot-sub{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono';margin-top:2px;}
  .slot .remove-x{position:absolute;top:8px;right:10px;color:var(--text-dim);font-size:13px;}
  .slot .empty-plus{font-family:'Oswald';font-size:22px;color:var(--text-dim);align-self:center;}

  .overlay{position:fixed;inset:0;background:rgba(6,20,13,0.75);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto;}
  .box{background:var(--bg-alt);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;}
  .box .head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .box .head h4{margin:0;font-family:'Oswald';font-size:16px;text-transform:uppercase;}
  .box .head button.close{background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;}
  .box .body-scroll{overflow-y:auto;padding:16px 18px;}
  .search-bar{padding:12px 18px;border-bottom:1px solid var(--line);}
  .search-bar input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Inter';}
  .picker-list{overflow-y:auto;padding:8px;}
  .picker-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;}
  .picker-item:hover{background:var(--surface);}
  .picker-item .pname{font-family:'Inter';font-size:14px;}
  .picker-item .pclub{font-size:11px;color:var(--text-dim);}
  .picker-item .pmeta{font-family:'JetBrains Mono';font-size:12px;color:var(--text-dim);display:flex;gap:10px;align-items:center;}
  .picker-item.disabled{opacity:0.35;pointer-events:none;}

  .stat-table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono';font-size:13px;}
  .stat-table th{text-align:left;color:var(--text-dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;padding:8px 10px;border-bottom:1px solid var(--line);}
  .stat-table td{padding:9px 10px;border-bottom:1px solid var(--line);}
  .stat-table tr:hover td{background:rgba(245,243,237,0.03);}
  .stat-table tr{cursor:pointer;}

  .summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px;}
  .summary-card{
    position:relative; overflow:hidden; border-radius:18px; padding:18px 18px 16px;
    background:var(--surface); border:1px solid var(--line);
  }
  .summary-card.grad-gold, .summary-card.grad-teal, .summary-card.grad-plum, .summary-card.grad-rose, .summary-card.grad-blue{background:var(--surface); border-color:var(--line);}
  .summary-card-icon{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(242,184,7,0.12); color:var(--accent); margin-bottom:10px; flex-shrink:0;
  }
  .summary-card.grad-teal .summary-card-icon{background:rgba(47,158,126,0.14); color:#4FC3A1;}
  .summary-card.grad-plum .summary-card-icon{background:rgba(155,107,196,0.14); color:#B98FE0;}
  .summary-card.grad-rose .summary-card-icon{background:rgba(211,86,76,0.14); color:#E08278;}
  .summary-card.grad-blue .summary-card-icon{background:rgba(79,160,224,0.14); color:#4FA0E0;}
  .summary-card .label{font-family:'JetBrains Mono';font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;}
  .summary-card .value{font-family:'Oswald';font-size:26px;font-weight:600;margin-top:4px;letter-spacing:0.3px;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);font-family:'Inter';}
  .empty-state .big{font-family:'Oswald';font-size:20px;color:var(--text);margin-bottom:8px;}

  /* player detail modal */
  .player-head{display:flex;gap:14px;align-items:center;margin-bottom:18px;}
  .player-head .pos-chip{font-family:'JetBrains Mono';font-size:11px;padding:4px 9px;border-radius:6px;color:#0B2E1F;font-weight:600;}
  .player-head h2{font-family:'Oswald';font-size:22px;margin:4px 0 2px;}
  .player-head .sub{color:var(--text-dim);font-size:13px;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .stat-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
  .stat-box .n{font-family:'Oswald';font-size:20px;}
  .stat-box .l{font-family:'JetBrains Mono';font-size:10px;color:var(--text-dim);text-transform:uppercase;margin-top:2px;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .btn{font-family:'Oswald';text-transform:uppercase;font-size:13px;letter-spacing:0.4px;border:none;border-radius:999px;padding:10px 18px;cursor:pointer;}
  .btn.primary{background:var(--accent);color:#0B2E1F;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}

  /* matches tab */
  .match-filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .match-filters button{font-family:'JetBrains Mono';font-size:12px;background:var(--surface);border:1px solid var(--line);color:var(--text-dim);padding:7px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .match-filters button.active{color:var(--bg);background:var(--accent);border-color:var(--accent);}
  .match-list{display:flex;flex-direction:column;gap:10px;}
  .match-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;flex-wrap:wrap;}
  .match-card:hover{border-color:var(--accent-dim);}
  .type-badge{font-family:'JetBrains Mono';font-size:9px;text-transform:uppercase;letter-spacing:0.4px;padding:4px 8px;border-radius:6px;white-space:nowrap;font-weight:600;}
  .match-date{font-family:'JetBrains Mono';font-size:11px;color:var(--text-dim);min-width:78px;}
  .match-teams{font-family:'Inter';font-size:14px;flex:1;min-width:160px;}
  .match-score{font-family:'Oswald';font-size:16px;min-width:60px;text-align:center;}
  .match-comp{font-size:11px;color:var(--text-dim);width:100%;margin-top:2px;}
  .counts-flag{font-family:'JetBrains Mono';font-size:10px;padding:3px 7px;border-radius:5px;}
  .counts-flag.yes{background:rgba(242,184,7,0.15);color:var(--accent);}
  .counts-flag.no{background:rgba(169,193,175,0.1);color:var(--text-dim);}

  .event-list{list-style:none;padding:0;margin:0 0 16px;font-family:'JetBrains Mono';font-size:13px;}
  .event-list li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);}
  .event-list .min{color:var(--text-dim);width:36px;}

  /* news tab */
  .news-cat{margin-bottom:22px;}
  .news-item{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:8px;text-decoration:none;color:var(--text);gap:14px;}
  .news-item:hover{border-color:var(--accent-dim);}
  .news-item .t{font-size:14px;}
  .news-item .s{font-family:'JetBrains Mono';font-size:11px;color:var(--accent);margin-top:2px;letter-spacing:0.3px;}
  .news-item .r{font-size:12px;color:var(--text-dim);margin-top:5px;line-height:1.4;max-width:480px;}
  .news-item .go{color:var(--accent);font-family:'JetBrains Mono';font-size:12px;white-space:nowrap;align-self:flex-start;}
  .news-note{background:rgba(242,184,7,0.08);border:1px solid var(--accent-dim);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--text-dim);margin-bottom:20px;}
  .tm-nownow{text-align:center;background:rgba(242,184,7,0.08);border:1px solid var(--accent-dim);border-radius:12px;padding:14px;margin-bottom:18px;}
  .tm-nownow-label{font-family:'JetBrains Mono';font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}
  .tm-nownow-value{font-family:'Oswald';font-weight:700;font-size:19px;color:var(--accent);margin-top:2px;}
  .tm-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .tm-col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;}
  @media (max-width:600px){ .tm-columns{grid-template-columns:1fr;} }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:4px;}

  .cal-header{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px;}
  .cal-nav{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;cursor:pointer;font-family:'Oswald';}
  .cal-nav:hover{border-color:var(--accent-dim);}
  .cal-title{font-family:'Oswald';font-size:18px;text-transform:uppercase;letter-spacing:0.5px;min-width:180px;text-align:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .cal-weekdays .cal-wd{text-align:center;font-family:'JetBrains Mono';font-size:11px;color:var(--text-dim);text-transform:uppercase;padding-bottom:4px;}
  .cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:64px;padding:6px;position:relative;}
  .cal-cell.empty{background:transparent;border:none;}
  .cal-cell.has-match{cursor:pointer;border-color:var(--accent-dim);}
  .cal-cell.has-match:hover{border-color:var(--accent);}
  .cal-cell.today{outline:2px solid var(--accent);outline-offset:-2px;}
  .cal-cell.selected{background:var(--surface-2);}
  .cal-daynum{font-family:'JetBrains Mono';font-size:11px;color:var(--text-dim);}
  .cal-ball{font-size:16px;text-align:center;margin-top:6px;position:relative;display:flex;gap:3px;flex-wrap:wrap;justify-content:center;}
  .cal-dot-ball{font-size:16px;}
  .cal-dot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:16px;border-radius:5px;font-family:'JetBrains Mono';font-size:8px;font-weight:700;color:#fff;letter-spacing:0.2px;}
  .cal-excl{position:absolute;top:-8px;right:0;font-size:12px;}
  .cal-period-badge{position:absolute;top:2px;left:2px;color:var(--accent);opacity:0.9;}
  .cal-cell.zomerstop{background:repeating-linear-gradient(135deg, var(--surface) 0 8px, rgba(242,184,7,0.06) 8px 16px);}
  .cal-cell.winterstop{background:repeating-linear-gradient(135deg, var(--surface) 0 8px, rgba(79,143,184,0.10) 8px 16px);}
  .cal-legend{display:flex;flex-wrap:wrap;gap:14px;font-family:'JetBrains Mono';font-size:12px;color:var(--text-dim);margin-top:8px;}
  .cal-legend-item{display:flex;align-items:center;gap:7px;}
  .cal-swatch{width:20px;height:14px;border-radius:4px;display:inline-block;}
  .cal-swatch.zomerstop{background:repeating-linear-gradient(135deg, var(--surface) 0 4px, rgba(242,184,7,0.35) 4px 8px);border:1px solid var(--line);}
  .cal-swatch.winterstop{background:repeating-linear-gradient(135deg, var(--surface) 0 4px, rgba(79,143,184,0.45) 4px 8px);border:1px solid var(--line);}

  .picker-filters{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px;border-bottom:1px solid var(--line);}
  .picker-filters select, .picker-filters input{background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 10px;font-family:'JetBrains Mono';font-size:12px;}
  .picker-filters input[type=number]{width:118px;}
  .injury-x{font-size:12px;vertical-align:middle;}
  .tm-link{display:inline-block;font-family:'JetBrains Mono';font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--accent-dim);border-radius:8px;padding:7px 12px;margin-bottom:14px;}
  .tm-link:hover{background:rgba(242,184,7,0.08);}
  .team-logo{width:18px;height:18px;object-fit:contain;vertical-align:middle;margin-right:5px;border-radius:3px;background:#fff;padding:1px;}
  .logo-lg .team-logo{width:48px;height:48px;font-size:36px;margin-right:0;}
  .logo-lg .team-flag{font-size:13px;padding:4px 8px;}
  .star-rating{position:relative;display:inline-block;line-height:1;white-space:nowrap;vertical-align:middle;}
  .star-rating-sm{font-size:11px;}
  .star-rating-lg{font-size:18px;}
  .star-rating .sr-empty{color:var(--line);letter-spacing:1px;}
  .star-rating .sr-filled{position:absolute;top:0;left:0;overflow:hidden;color:var(--accent);white-space:nowrap;letter-spacing:1px;}
  .sr-num{font-family:'JetBrains Mono';font-size:10px;color:var(--text-dim);margin-left:4px;vertical-align:middle;}
  .star-rating-na{font-family:'JetBrains Mono';font-size:10px;color:var(--text-dim);}

  .group-tabs{margin-bottom:0;}
  .sub-tabs{border-bottom:1px solid var(--line);margin-bottom:22px;padding-top:2px;}
  .sub-tabs button{font-size:12px;padding:8px 4px;}

  .icon-wrap{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-wrap svg{width:100%;height:100%;}

  .primary-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:0;flex-wrap:wrap;}
  .primary-tabs button{
    display:flex;align-items:center;gap:8px;font-family:'Oswald';font-size:13px;text-transform:uppercase;letter-spacing:0.4px;
    background:none;border:none;color:var(--text-dim);padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent;transition:color .15s,border-color .15s;
  }
  .primary-tabs button:hover{color:var(--text);}
  .primary-tabs button.active{color:var(--accent);border-color:var(--accent);}
  .primary-tabs button span{white-space:nowrap;}
  .nav-more-wrap{position:relative;}
  .nav-more-menu{
    position:absolute;top:100%;left:0;margin-top:6px;background:var(--bg-alt);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:40;min-width:190px;overflow:hidden;padding:6px;
  }
  .nav-more-menu button{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--text-dim);
    font-family:'Inter';font-size:13px;padding:10px 12px;border-radius:8px;cursor:pointer;
  }
  .nav-more-menu button:hover{background:var(--surface);color:var(--text);}
  .nav-more-menu button.active{color:var(--accent);background:rgba(242,184,7,0.08);}

  /* Tijdmachine: fysiek verschil in cursor + achtergrond tussen verleden/toekomst */
  body.time-travel-past{ cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34"><g fill="none" stroke="%239B6BC4" stroke-width="2.4"><path d="M17 4a13 13 0 100 26 13 13 0 000-26z" opacity="0.5"/><path d="M17 8a9 9 0 100 18 9 9 0 000-18z"/><path d="M17 12v5l4 3"/></g></svg>') 17 17, auto !important; }
  body.time-travel-future{ cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34"><g fill="none" stroke="%234FC3A1" stroke-width="2.4"><path d="M17 4a13 13 0 100 26 13 13 0 000-26z" opacity="0.5"/><path d="M8 17h18M20 12l6 5-6 5"/></g></svg>') 17 17, auto !important; }
  body.time-travel-past.time-travel-theme{
    background:
      radial-gradient(900px 400px at 15% -10%, rgba(155,107,196,0.16), transparent 60%),
      linear-gradient(180deg, #241832 0%, #1A1224 45%, #120D19 100%) !important;
  }
  body.time-travel-future.time-travel-theme{
    background:
      radial-gradient(900px 400px at 85% -10%, rgba(79,195,161,0.16), transparent 60%),
      linear-gradient(180deg, #0F2A26 0%, #0D211E 45%, #0A1917 100%) !important;
  }
  body.time-travel-past .wrap::after{ border-color:#9B6BC4; color:#D9C6F0; background:rgba(155,107,196,0.14); content:'⏪ Tijdreis naar het VERLEDEN — bekijken, niet aanpasbaar buiten Sandbox'; }
  body.time-travel-future .wrap::after{ border-color:#4FC3A1; color:#C9F0E4; background:rgba(79,195,161,0.14); content:'⏩ Tijdreis naar de TOEKOMST — wijzigingen worden gepland, niet direct doorgevoerd'; }

  /* Shirtje-icoon per club */
  .jersey{display:inline-block;vertical-align:middle;margin-right:4px;}
  .bankie-panel{
    position:fixed;bottom:20px;right:20px;width:320px;max-height:60vh;overflow-y:auto;
    background:var(--bg-alt);border:1px solid var(--accent-dim);border-radius:16px;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);z-index:90;
  }
  .bankie-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);}
  .bankie-avatar{font-size:26px;}
  .bankie-sub{font-size:11px;color:var(--text-dim);}
  .bankie-head .close{margin-left:auto;background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;}
  .bankie-body{padding:14px 16px;}
  .bankie-tip{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:8px;line-height:1.4;}
  .bankie-footnote{font-size:10px;color:var(--text-dim);margin-top:8px;line-height:1.4;}

  .loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:100;}
  .spinner{width:44px;height:44px;border:4px solid rgba(242,184,7,0.25);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .view-toggle{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .view-toggle button{background:none;border:none;color:var(--text-dim);padding:9px 14px;cursor:pointer;font-size:16px;}
  .view-toggle button.active{background:var(--accent);color:#0B0B0C;}
  .bankie-launcher{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);border:none;font-size:26px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,0.35);z-index:90;display:flex;align-items:center;justify-content:center;transition:opacity .2s, transform .2s;transform:translate(var(--float-dx,0px),var(--float-dy,0px));}
  .bankie-launcher.hidden{opacity:0;pointer-events:none;transform:translate(calc(var(--float-dx,0px) + 20px),var(--float-dy,0px));}
  .bankie-badge{position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;width:20px;height:20px;border-radius:50%;font-family:'Oswald';font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);}

  .tutorial-backdrop{position:fixed;inset:0;background:rgba(4,5,6,0.38);z-index:200;}
  .tutorial-pulse{position:relative;animation:tutorialPulse 1.4s ease-in-out infinite;box-shadow:0 0 0 3px #F2B807, 0 0 24px 6px rgba(242,184,7,0.55) !important;z-index:202 !important;}
  @keyframes tutorialPulse{0%,100%{box-shadow:0 0 0 3px #F2B807, 0 0 16px 4px rgba(242,184,7,0.4);}50%{box-shadow:0 0 0 3px #F2B807, 0 0 28px 10px rgba(242,184,7,0.7);}}
  .tutorial-card{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(480px,92vw);
    background:var(--bg-alt);border:1px solid var(--accent-dim);border-radius:20px;padding:22px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 0 1px rgba(242,184,7,0.15);z-index:201;
  }
  .tutorial-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .tutorial-icon{width:34px;height:34px;border-radius:50%;background:rgba(242,184,7,0.14);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tutorial-progress{font-family:'JetBrains Mono';font-size:11px;color:var(--text-dim);flex:1;}
  .tutorial-skip{background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:999px;padding:6px 12px;font-family:'JetBrains Mono';font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;}
  .tutorial-skip:hover{color:var(--text);border-color:var(--accent-dim);}
  .tutorial-title{font-family:'Oswald';font-size:19px;margin:0 0 10px;color:var(--text);}
  .tutorial-body{font-size:14px;line-height:1.6;color:var(--text-dim);margin-bottom:16px;}
  .tutorial-body b{color:var(--text);}
  .tutorial-dots{display:flex;justify-content:center;gap:6px;margin-bottom:16px;}
  .tutorial-dot{width:6px;height:6px;border-radius:50%;background:var(--line);}
  .tutorial-dot.active{background:var(--accent);width:18px;border-radius:3px;}
